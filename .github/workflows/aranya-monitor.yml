name: Aranya slot monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aranya-slot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TREK_TARGETS: "17:112:Kudremukha Trek;24:113:Nethravathi Trek"
      WEEKENDS_ONLY: "true"
      CHECK_NEXT_DAYS: "15"
      CAPACITY_FILTER: "300"
      ALERT_ON_FIRST_POSITIVE: "false"
      ALERT_ON_EVERY_POSITIVE: "false"
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
      TWILIO_CONTENT_VARIABLES: ${{ secrets.TWILIO_CONTENT_VARIABLES }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check slots
        run: node ./aranya-monitor.mjs

      - name: Save monitor state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Aranya monitor state"
            git push
          else
            echo "No state changes."
          fi
